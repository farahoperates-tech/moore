<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GARBHA — Chapter One: Asia</title>
<style>
  :root{ --edge:#2b3a72; --phos:#7ff0b0; --gold:#ffcf5c; --term:"Courier New",Courier,monospace; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#03050c}
  body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;
    font-family:var(--term);color:var(--phos);padding:12px;
    background:radial-gradient(120% 90% at 50% 0%,#0a1024,#03050c 70%);
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  .machine{width:100%;max-width:820px;display:flex;flex-direction:column;border:2px solid var(--edge);
    border-radius:8px;overflow:hidden;background:linear-gradient(180deg,#0c1330,#080c1e);
    box-shadow:0 0 0 4px #05070f,0 26px 60px -20px #000,inset 0 0 40px rgba(43,58,114,.25)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;
    background:linear-gradient(180deg,#1a2450,#141c40);border-bottom:2px solid var(--edge);
    font-size:12px;letter-spacing:.1em;color:#9fb3ff}
  .topbar .lamp{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);
    display:inline-block;margin-right:6px;animation:flick 3s infinite}
  @keyframes flick{0%,100%{opacity:1}47%{opacity:.6}49%{opacity:.9}}
  .topbar .right{color:#7d8ec9;letter-spacing:.14em;text-align:right}
  .screen{position:relative;background:#05070f}
  canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
  .scan{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.32;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.5) 3px,rgba(0,0,0,0) 4px)}
  .vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 20px rgba(0,0,0,.7)}
  .console{background:#070b1c;border-top:2px solid var(--edge);padding:10px 14px 11px;min-height:66px;
    font-size:15px;line-height:1.45;letter-spacing:.02em}
  .console .cap{color:var(--phos);text-shadow:0 0 6px rgba(127,240,176,.35);white-space:pre-wrap}
  .console .cap.voice{color:var(--gold);font-style:italic;text-shadow:0 0 8px rgba(255,207,92,.4)}
  .console .cap.snark{color:#ff9de0;text-shadow:0 0 8px rgba(255,157,224,.4)}
  .cur{display:inline-block;width:8px;height:15px;background:var(--phos);vertical-align:-2px;margin-left:2px;
    animation:blink 1s step-start infinite;box-shadow:0 0 6px var(--phos)}
  @keyframes blink{50%{opacity:0}}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;
    background:#0a1024;border-top:1px solid #16204a;font-size:11px;color:#7d8ec9;letter-spacing:.08em}
  .inv{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;flex-shrink:0}
  .inv .slot{width:26px;height:26px;border:1px solid #263468;border-radius:4px;background:#0c1330;
    display:flex;align-items:center;justify-content:center;image-rendering:pixelated;position:relative;opacity:.3}
  .inv .slot.have{opacity:1;border-color:#3b56a8}
  .inv .slot.lit{box-shadow:0 0 10px var(--gold);border-color:var(--gold)}
  .inv .slot canvas{width:22px;height:22px}
  .inv .slot .dur{position:absolute;bottom:-1px;right:1px;font-size:8px;color:var(--gold)}
  .hud button{font-family:var(--term);font-size:11px;color:#9fb3ff;background:#0c1330;border:1px solid #263468;
    border-radius:4px;padding:5px 9px;cursor:pointer;letter-spacing:.1em}
  .hud button:hover{border-color:#3b56a8;color:#cfe0ff}
  #hint{flex:1;text-align:center;min-width:120px}
</style>
</head>
<body>
<div class="machine">
  <div class="topbar">
    <span><span class="lamp"></span>GARBHA.EXE</span>
    <span class="right" id="place">CH. I — ASIA</span>
  </div>
  <div class="screen">
    <canvas id="game" width="320" height="200"></canvas>
    <div class="vig"></div>
    <div class="scan"></div>
  </div>
  <div class="console"><span class="cap" id="cap"></span><span class="cur" id="cur"></span></div>
  <div class="hud">
    <div class="inv" id="inv">
      <div class="slot" data-i="knife" title="blade"><canvas width="16" height="16"></canvas><span class="dur" id="dur"></span></div>
      <div class="slot" data-i="bow" title="bow"><canvas width="16" height="16"></canvas><span class="dur" id="arrn"></span></div>
      <div class="slot" data-i="candle" title="candle"><canvas width="16" height="16"></canvas></div>
      <div class="slot" data-i="coat" title="coat"><canvas width="16" height="16"></canvas></div>
      <div class="slot" data-i="food" title="food"><canvas width="16" height="16"></canvas><span class="dur" id="breadn"></span></div>
      <div class="slot" data-i="map" title="map"><canvas width="16" height="16"></canvas></div>
    </div>
    <div id="hint">click to wake</div>
    <button id="mute">♪ SOUND</button>
  </div>
</div>
<script>
(function(){
"use strict";
const cv=document.getElementById("game"), g=cv.getContext("2d"); g.imageSmoothingEnabled=false;
const W=320,H=200, BUILD="v14 · day-night + coat";
const capEl=document.getElementById("cap"), hintEl=document.getElementById("hint"),
      placeEl=document.getElementById("place"), durEl=document.getElementById("dur"),
      breadnEl=document.getElementById("breadn"), arrnEl=document.getElementById("arrn");

const C={ ink:"#05070f", night:"#080c1e",
  skin:"#d2a074", skinD:"#a97e54", hair:"#22161a",
  cloak:"#4a3b4e", cloakD:"#2f2634", cloakH:"#5f4d66", coat:"#5a3a2a", coatH:"#7a5238",
  blood:"#8f1626", bloodD:"#5c0f1a", trunk:"#3a2a1c", trunkD:"#241a12",
  gold:"#ffcf5c", goldD:"#c99a2e", flame:"#ffb347", flameD:"#f0842a", ember:"#ff6a2a",
  snow:"#dce6f2", snowD:"#b8c6dc", ice:"#9fd0e8", sea:"#22384f", seaD:"#16283a", seaH:"#3a5a78",
  wolf:"#5a5f6e", wolfD:"#3c414e", wolfH:"#7b8092", fang:"#e8ecf5",
  bear:"#4a3a30", bearD:"#2e231c", bearH:"#6a5443",
  deer:"#8a6a44", deerD:"#5e472e", raven:"#0c0e16", horse:"#6a5240",
  ranger:"#20304a", rangerH:"#4a6a8a", spirit:"#7fe0c8",
  steel:"#c9d2e6", rust:"#7a4a30", rustD:"#4a2c1c", concrete:"#4a5162", concreteD:"#2e3440",
  shadow:"#04060c", bone:"#d8cdb0", phos:"#7ff0b0", rain:"#7fa8d8", rainH:"#c3daf5" };
function px(x,y,w,h,col){ g.fillStyle=col; g.fillRect(x|0,y|0,w|0,h|0); }

const BIOME={
  autumn:{ g0:"#241d15", g1:"#2f2418", cA:"#3b3a1f", cB:"#4d4326", cH:"#6e5f2c", snow:0,   precip:"rain",  cold:1.4, dark:0.74 },
  frost: { g0:"#20241f", g1:"#2a2f27", cA:"#2f3a2a", cB:"#3a4530", cH:"#54633c", snow:0.25,precip:"sleet", cold:2.2, dark:0.78 },
  winter:{ g0:"#28303a", g1:"#323c48", cA:"#26382c", cB:"#31472f", cH:"#43603b", snow:0.7, precip:"snow",  cold:3.6, dark:0.82 },
  steppe:{ g0:"#2a2a1e", g1:"#353525", cA:"#3a3a26", cB:"#48482f", cH:"#66663f", snow:0.15,precip:"wind",  cold:2.6, dark:0.72 },
  mtn:   { g0:"#3a4658", g1:"#48566c", cA:"#2a3a48", cB:"#37485a", cH:"#54708a", snow:1.0, precip:"blizzard",cold:5.5, dark:0.87 },
  cave:  { g0:"#171310", g1:"#201914", cA:"#241a12", cB:"#2e2016", cH:"#3a2a1c", snow:0, precip:"none",  cold:-6, dark:0.9 },
  sea:   { g0:"#26303a", g1:"#2e3a46", cA:"#26382c", cB:"#31472f", cH:"#43603b", snow:0.4, precip:"snow",  cold:3.4, dark:0.8 }
};

const dark=document.createElement("canvas"); dark.width=W; dark.height=H; const dg=dark.getContext("2d");

// ---------- audio ----------
let ac=null, muted=false, windNode=null, windGainNode=null;
const muteBtn=document.getElementById("mute");
function actx(){ if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(ac&&ac.state==="suspended")ac.resume(); return ac; }
function tone(f0,f1,dur,when,type,vol){ if(muted||!actx())return; const t=ac.currentTime+(when||0);
  const o=ac.createOscillator(),ga=ac.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur); ga.gain.setValueAtTime(0.0001,t);
  ga.gain.exponentialRampToValueAtTime(vol||0.15,t+0.02); ga.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(ga).connect(ac.destination); o.start(t); o.stop(t+dur+0.05); }
function noise(dur,when,freq,vol,type){ if(muted||!actx())return; const t=ac.currentTime+(when||0);
  const n=Math.max(1,Math.floor(ac.sampleRate*dur)),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1); const s=ac.createBufferSource(); s.buffer=b;
  const f=ac.createBiquadFilter(); f.type=type||"lowpass"; f.frequency.value=freq||600;
  const ga=ac.createGain(); ga.gain.setValueAtTime(vol||0.2,t); ga.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(ga).connect(ac.destination); s.start(t); s.stop(t+dur+0.02); }
function sfxStep(){ noise(0.08,0,380,0.15,"lowpass"); tone(110,60,0.09,0,"sine",0.08); }
function sfxLight(){ noise(0.35,0,900,0.16,"bandpass"); tone(300,700,0.3,0.02,"sine",0.08); }
function sfxSwing(){ noise(0.09,0,2200,0.18,"highpass"); }
function sfxBow(){ noise(0.06,0,3000,0.14,"highpass"); tone(900,300,0.08,0,"triangle",0.08); }
function sfxHitEnemy(){ noise(0.08,0,500,0.2,"lowpass"); tone(220,120,0.08,0,"square",0.1); }
function sfxHurt(){ tone(200,70,0.35,0,"sawtooth",0.2); }
function sfxWolf(){ tone(300,160,0.4,0,"sawtooth",0.12); tone(240,120,0.5,0.1,"sawtooth",0.1); }
function sfxBear(){ tone(120,60,0.6,0,"sawtooth",0.2); tone(90,50,0.7,0.12,"sawtooth",0.16); }
function sfxChime(){ tone(560,840,0.2,0,"triangle",0.1); tone(840,1200,0.25,0.14,"triangle",0.09); tone(1200,1600,0.3,0.3,"triangle",0.08); }
function sfxBreak(){ noise(0.2,0,3000,0.25,"highpass"); tone(400,120,0.15,0,"square",0.1); }
function sfxAlert(t){ tone(760,1200,0.1,0,"square",0.13); if(t==="wolf")setTimeout(()=>sfxWolf(),110); if(t==="bear")setTimeout(()=>sfxBear(),110); }
function heartbeat(){ tone(70,42,0.16,0,"sine",0.2); tone(66,40,0.16,0.2,"sine",0.15); }
function windStart(){ if(muted||!actx()||windNode)return; const n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*0.5; windNode=ac.createBufferSource(); windNode.buffer=b; windNode.loop=true;
  const f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=600; f.Q.value=0.5;
  windGainNode=ac.createGain(); windGainNode.gain.value=0.05; windNode.connect(f).connect(windGainNode).connect(ac.destination); windNode.start(); }
function setWind(v){ if(windGainNode) windGainNode.gain.value=v; }
function windStop(){ if(windNode){try{windNode.stop()}catch(e){} windNode=null;} }
muteBtn.addEventListener("click",()=>{ actx(); muted=!muted; muteBtn.textContent=muted?"♪ MUTED":"♪ SOUND"; if(muted)windStop(); else if(scene.mode==="play")windStart(); });

// ---------- caption ----------
let capFull="",capShown=0,capT=0,onCapDone=null;
function caption(text,opt){ capFull=text; capShown=0; capT=0; onCapDone=(opt&&opt.cb)||null;
  capEl.className="cap"+((opt&&opt.voice)?" voice":"")+((opt&&opt.snark)?" snark":""); }
function capDone(){ return capShown>=capFull.length; }
function updateCap(dt){ if(capShown<capFull.length){ capT+=dt; while(capT>1/26&&capShown<capFull.length){capT-=1/26;capShown++;if(capFull[capShown-1]!==" ")tone(1400,1400,0.01,0,"square",0.012);} capEl.textContent=capFull.slice(0,capShown); if(capShown>=capFull.length&&onCapDone){const c=onCapDone;onCapDone=null;c();} } }

// ---------- sprites ----------
function sprPlayer(x,y,dir,phase,coat){ const P=(a,b,w,h,col)=>{g.fillStyle=col;g.fillRect((x+a)|0,(y+b)|0,w,h);};
  P(-6,6,12,4,C.shadow); const body=coat?C.coat:C.cloakD, bH=coat?C.coatH:C.cloak;
  P(-5,-1,10,9,body); P(-5,-1,10,3,bH); P(-4,1,8,5,bH); P(2,-1,3,7,coat?C.coatH:C.cloakH);
  if(!coat){P(-2,3,3,2,C.blood);P(0,5,2,1,C.bloodD);}
  const fx=(phase%2===0)?-1:1; P(-4,7,3,2,C.trunkD); P(1,7,3,2,C.trunkD); P(-4+(fx<0?-1:1),8,3,1,C.cloakD);
  P(-4,-6,8,7,C.hair); P(-3,-7,6,2,C.hair); P(-3,-2,6,2,C.skinD);
  let hx=0,hy=0; if(dir==="left")hx=-2;else if(dir==="right")hx=2;else if(dir==="up")hy=-2;else hy=1;
  P(-2+hx*0.5,-1+hy,4,2,C.skin); P(-3+hx,-4,2,1,C.hair); }
function sprTree(x,y,B){ px(x-7,y+7,14,4,C.shadow); px(x-1,y+2,3,7,C.trunkD); px(x-1,y+2,1,7,C.trunk);
  const a=[[-8,-8,10,10],[-2,-12,11,11],[2,-4,9,9],[-9,-2,8,8]]; for(const s of a)px(x+s[0],y+s[1],s[2],s[3],B.cA);
  const b=[[-6,-7,7,7],[0,-10,8,8],[3,-3,6,6]]; for(const s of b)px(x+s[0],y+s[1],s[2],s[3],B.cB);
  px(x-4,y-8,3,3,B.cH); px(x+2,y-9,2,2,B.cH); if(B.snow>0.5){px(x-2,y-12,8,2,C.snow);px(x-8,y-6,3,2,C.snowD);px(x+4,y-4,3,2,C.snowD);} }
function sprWolf(x,y,dir,ph){ px(x-6,y+4,12,3,C.shadow); px(x-7,y-3,14,7,C.wolfD); px(x-7,y-3,14,3,C.wolf); px(x-6,y-2,12,2,C.wolfH);
  const hx=dir==="left"?-8:8; px(x+hx-2,y-4,5,5,C.wolf); px(x+hx-2,y-6,2,2,C.wolfD); px(x+hx+1,y-6,2,2,C.wolfD);
  px(x+(dir==="left"?hx-3:hx+2),y-2,2,1,C.fang); const fp=(ph%2)?1:-1; px(x-4,y+3,2,2,C.wolfD); px(x+3,y+3+fp,2,2,C.wolfD); }
function sprBear(x,y,dir,ph){ px(x-10,y+5,20,4,C.shadow); px(x-10,y-6,20,11,C.bearD); px(x-10,y-6,20,4,C.bear); px(x-9,y-5,18,3,C.bearH);
  const hx=dir==="left"?-11:11; px(x+hx-3,y-6,7,7,C.bear); px(x+hx-3,y-9,2,3,C.bearD); px(x+hx+2,y-9,2,3,C.bearD);
  px(x+(dir==="left"?hx-4:hx+2),y-2,2,2,"#1a120e"); const fp=(ph%2)?1:-1; px(x-7,y+4,4,3,C.bearD); px(x+4,y+4+fp,4,3,C.bearD); }
function sprDeer(x,y,dir){ px(x-5,y+4,10,3,C.shadow); px(x-5,y-4,10,7,C.deerD); px(x-5,y-4,10,2,C.deer);
  const hx=dir==="left"?-6:6; px(x+hx-1,y-8,3,6,C.deer); px(x+hx-2,y-11,2,3,C.deerD); px(x+hx+1,y-11,2,3,C.deerD);
  px(x-3,y+3,2,3,C.deerD); px(x+2,y+3,2,3,C.deerD); }
function sprRaven(x,y){ px(x-3,y+2,6,2,C.shadow); px(x-3,y-2,6,3,C.raven); px(x-4,y-1,2,2,C.raven); px(x+2,y-1,2,2,C.raven); px(x-4,y-3,2,2,C.raven); px(x+2,y-1,1,1,C.goldD); }
function sprHorse(x,y,dir){ px(x-7,y+4,14,3,C.shadow); px(x-8,y-5,16,9,C.horse); px(x-8,y-5,16,3,"#7d6350");
  const hx=dir==="left"?-9:9; px(x+hx-2,y-8,4,6,C.horse); px(x-6,y+3,2,4,C.trunkD); px(x+4,y+3,2,4,C.trunkD); }
function sprRanger(x,y,ph){ px(x-9,y+8,18,4,C.shadow); px(x-8,y-16,16,24,C.ranger); px(x-8,y-16,16,4,C.rangerH); px(x-6,y-14,12,20,"#182338");
  g.save(); g.globalCompositeOperation="lighter"; px(x-9,y-22,2,8,C.spirit); px(x-13,y-20,2,5,C.spirit); px(x+7,y-22,2,8,C.spirit); px(x+11,y-20,2,5,C.spirit); g.restore();
  px(x-4,y-11,3,3,C.spirit); px(x+2,y-11,3,3,C.spirit); const s=0.6+Math.sin(ph)*0.2; g.globalAlpha=s; px(x-2,y-4,4,6,C.spirit); g.globalAlpha=1; }
function sprHuman(x,y,dir,ph){ px(x-5,y+5,10,3,C.shadow); px(x-4,y-1,8,8,"#3a3540"); px(x-4,y-1,8,2,"#4a4550");
  px(x-3,y-6,6,6,"#b9a99a"); px(x-2,y-4,1,1,"#20161a"); px(x+1,y-4,1,1,"#20161a"); const fp=(ph%2)?1:-1; px(x-3,y+6,2,2,"#2a2530"); px(x+1,y+6+fp,2,2,"#2a2530"); }
function sprFire(x,y,lit,t){ px(x-6,y+3,12,3,C.shadow); px(x-6,y+1,12,3,C.trunkD); px(x-5,y,4,2,C.trunk); px(x+2,y,4,2,C.trunk);
  if(lit){ const f=1+Math.sin(t*13)*0.3; g.save(); g.globalCompositeOperation="lighter"; px(x-3,y-4-f,6,6,C.flameD); px(x-2,y-7-f,4,6,C.flame); px(x-1,y-9-f,2,4,C.gold);
    const gr=g.createRadialGradient(x,y-4,0,x,y-4,44); gr.addColorStop(0,"rgba(255,150,60,.35)"); gr.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle=gr; g.fillRect(x-44,y-48,88,88); g.restore(); } }
function sprShrine(x,y,t){ px(x-9,y+8,18,4,C.shadow); px(x-8,y-30,16,38,"#1a2436"); px(x-8,y-30,16,38,"#26324a"); px(x-8,y-30,5,38,"#33425f");
  g.save(); g.globalCompositeOperation="lighter"; const p=0.6+Math.sin(t*3)*0.3; g.globalAlpha=p; for(let i=0;i<5;i++)px(x-3,y-26+i*6,6,1,C.gold); px(x-2,y-14,4,4,C.spirit);
  const gr=g.createRadialGradient(x,y-14,0,x,y-14,50); gr.addColorStop(0,"rgba(127,224,200,.4)"); gr.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle=gr; g.fillRect(x-50,y-64,100,100); g.restore(); g.globalAlpha=1; }

function drawPrecip(kind,t,north){
  for(const r of drops){
    if(north){ r.y-=r.s*2.2; r.x-=r.s*0.6; if(r.y<0){r.y=H;r.x=Math.random()*W;} px(r.x,r.y,1,2,C.snow); continue; }
    if(kind==="snow"||kind==="sleet"){ r.y+=r.s*(kind==="sleet"?1.4:0.8); r.x+=Math.sin(t*2+r.ph)*0.4; if(r.y>H){r.y=-2;r.x=Math.random()*W;} px(r.x,r.y,1,1,C.snow); }
    else if(kind==="blizzard"){ r.y+=r.s*2.2; r.x-=r.s*1.6; if(r.y>H||r.x<0){r.y=-2;r.x=Math.random()*W+40;} px(r.x,r.y,1,1,C.snow); }
    else if(kind==="wind"){ r.x-=r.s*2.2; r.y+=Math.sin(t*3+r.ph)*0.3; if(r.x<0){r.x=W;r.y=Math.random()*H;} px(r.x,r.y,2,1,C.snowD); }
    else if(kind==="none"){ /* cave: no precip */ }
    else { r.y+=r.s*2.4; r.x-=r.s*0.5; if(r.y>H){r.y=-4;r.x=Math.random()*W;} if(r.x<0)r.x=W; g.strokeStyle=(Math.random()<0.15)?C.rainH:C.rain; g.globalAlpha=.5; g.beginPath(); g.moveTo(r.x,r.y); g.lineTo(r.x-2,r.y-5); g.stroke(); g.globalAlpha=1; }

function toLocal(e){ const r=cv.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX);

function click(x,y){
  if(scene.mode==="boot"){ startGame(); return; }
  if(fadeDir!==0) return;
  if(inv.mapOpen){ inv.mapOpen=false; return; }
  if(!capDone()){ capShown=capFull.length; capEl.textContent=capFull; if(onCapDone){const c=onCapDone;onCapDone=null;c();} return; }
  if(scene.mode==="san"){ sanClick(x,y); return; }
  if(scene.mode!=="play") return;
  const rm=R[ri];
  // strike nearest enemy in melee range
  let near=null,nd=99; for(const en of enemies){ if(en.dead)continue; const d=Math.hypot(x-en.x,y-en.y); if(d<nd){nd=d;near=en;} }
  if(near && nd<20){ const pd=Math.hypot(player.x-near.x,player.y-near.y);
    if(pd<26){ attack(); }                                   // adjacent → swing
    else if(inv.bow && inv.arrows>0){ shoot(near.x,near.y); } // far + bow → loose an arrow
    else { walkTo(near.x+(player.x<near.x?-16:16), near.y, ()=>{ if(!near.dead && Math.hypot(player.x-near.x,player.y-near.y)<28) attack(); }); } // walk up and swing
    return; }
  // interact: fires, pickups, slabs, dweller, shrine
  if(rm.fires) for(const f of rm.fires){ if(!f.lit && Math.hypot(x-f.x,y-f.y)<16){ walkTo(f.x,f.y+10,()=>lightFire(f)); return; } }
  if(rm.coat && !rm.coat.got && Math.hypot(x-rm.coat.x,y-rm.coat.y)<16){ walkTo(rm.coat.x,rm.coat.y+10,()=>{rm.coat.got=1;inv.coat=true;setInv();caption("You take the coat. The cold loses some teeth.");}); return; }

  if(rm.map && !rm.map.got && Math.hypot(x-rm.map.x,y-rm.map.y)<16){ walkTo(rm.map.x,rm.map.y+10,()=>{rm.map.got=1;inv.map=true;setInv();caption("A charcoal map — a dead traveller's own wandering. Tap the map to open what you have seen.");}); return; }

  if(rm.bow && !rm.bow.got && Math.hypot(x-rm.bow.x,y-rm.bow.y)<16){ walkTo(rm.bow.x,rm.bow.y+10,()=>{rm.bow.got=1;inv.bow=true;inv.arrows+=12;setInv();caption("A bow, and a quiver. Tap a distant foe to loose an arrow.");}); return; }

function attack(){
  if(scene.mode!=="play"||!weapon||player.atkCd>0) return;
  player.atkCd=0.34; player.attackT=0.18; sfxSwing();
  const dx={left:-1,right:1,up:0,down:0}[player.dir]||0, dy={up:-1,down:1,left:0,right:0}[player.dir]||0;
  const hx=player.x+dx*14, hy=player.y+dy*14; let hit=false;
  for(const en of enemies){ if(en.dead)continue; if(Math.hypot(hx-en.x,hy-en.y)<weapon.range){ hit=true; en.hp-=weapon.dmg||1; en.hurt=0.2; sfxHitEnemy(); en.x+=dx*5; en.y+=dy*5; burst(en.x,en.y,C.blood,5); if(en.hp<=0)killEnemy(en); } }
  if(hit){ weapon.dur--; if(weapon.dur<=0){ sfxBreak(); const was=weapon.name; belt[eqKey]=null; autoEquip(); caption("Your "+was+" breaks."+(weapon?(" You switch to your "+weapon.name+"."):(" You have no blade — run, or find one."))); } }
  setInv();
}
function shoot(tx,ty){ if(!inv.bow||inv.arrows<=0||player.atkCd>0)return; player.atkCd=0.4; inv.arrows--; setInv(); sfxBow();
  const a=Math.atan2(ty-player.y,tx-player.x); arrows.push({x:player.x,y:player.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,life:1.4}); }
function killEnemy(en){
  if(en.t==="ranger" && !gateOpen){ en.hp=6; en.hurt=0.3; en.x+=(en.x<player.x?-10:10); caption("You strike it down — but it reforms from the light. It cannot fall until you have walked all of Asia and the wind turns north."); return; }

// ---------- sanctuary ----------
function startGame(){ scene={mode:"san",step:0}; placeEl.textContent="GARBHA — THE WOMB"; player.x=160;player.y=118;player.tx=160;player.ty=118; candleR=0; hintEl.textContent="";
  caption("You wake in a dark room. You do not know why. You do not know where.",{cb:()=>{ setTimeout(()=>caption("It is dark. Your heart is beating too fast.",{cb:()=>{ setTimeout(()=>{scene.step=1;hintEl.textContent="click the golden arrow";caption("Something glints in the black. It wants you to reach for it.");},600); }}),600); }}); }

  if(scene.step===1){ if(Math.hypot(x-160,y-70)<40){ sfxChime(); scene.step=2; hintEl.textContent="click the candle"; caption("A box has opened. Inside: a candle. a knife. and something to munch on."); } return; }
  if(scene.step===2){ const items=[{k:"knife",x:130},{k:"candle",x:160},{k:"food",x:190}]; for(const it of items){ if(Math.abs(x-it.x)<14&&Math.abs(y-70)<16){ if(it.k==="candle")lightCandle(); else caption("Not yet. Light the candle first — you cannot see."); return; } } return; }
  if(scene.step===3){ if(Math.abs(x-40)<16&&Math.abs(y-104)<20){ sfxLight(); doFade(()=>gotoRoom(0,"s")); } else walkTo(x,y); return; }
}
function lightCandle(){ sfxLight(); inv.candle=true; inv.candleLit=true; belt.knife={name:"knife",dur:10,max:10,dmg:1,range:24}; weapon=belt.knife; eqKey="knife"; setInv(); scene.step=3; hintEl.textContent="click the door"; candleR=1;

// ---------- rooms ----------
function gotoRoom(i,from){ ri=i; const rm=R[i]; scene={mode:"play"}; placeEl.textContent=rm.name;
  hintEl.textContent="tap to walk · walk to an edge to travel · tap foes to fight";
  if(from==="s"){player.x=W/2;player.y=56;} else if(from==="n"){player.x=W/2;player.y=H-24;}
  else if(from==="e"){player.x=14;player.y=H/2;} else if(from==="w"){player.x=W-14;player.y=H/2;} else {player.x=W-14;player.y=H/2;}
  player.tx=player.x;player.ty=player.y;player.dir="left";player.arriveCb=null;player.entryGrace=0.5;
  enemies=(rm.enemies||[]).filter(e=>!(rm.guard&&e.t==="ranger"&&gateOpen)).map(mkEnemy);
  wildlife=(rm.wild||[]).map(w=>({t:w.t,x:w.x,y:w.y,ph:Math.random()*6,vx:0,vy:0,flee:0}));

  else caption(rm.enter, rm.scent?{cb:()=>{ setTimeout(()=>caption("You can smell it now. A soul, ancient, close.",{voice:knowledge}),1400); }}:null);
}
function checkGate(){ if(gateOpen) return; if(EXPLORABLE.every(r=>visited.has(r))){ openGate(); } }
function openGate(){ gateOpen=true; windNorth=true; gateStage=1; setWind(0.2);

  else caption("…look. everything is going north, bitch. the elk. the birds. the dead. everything but you. so GO. 🡱",{snark:true}); }

function mkEnemy(e){ const base={x:e.x,y:e.y,t:e.t,dir:"left",phase:Math.random()*6,hurt:0,cd:0,dead:false,aggroOn:false};
  if(e.t==="wolf")   Object.assign(base,{hp:2,spd:38,aggro:88,atk:16});
  if(e.t==="human")  Object.assign(base,{hp:3,spd:17,aggro:58,atk:14});

      setTimeout(()=>{ scene={mode:"end"}; placeEl.textContent="CH. I — KNOWLEDGE TAKEN"; hintEl.textContent="to be continued — EUROPE, and the LIGHT"; },1500); }}),1100); }}); }

// ---------- fx ----------
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,s=20+Math.random()*40; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4,max:0.4,c:col}); } }
function doFade(cb){ fadeDir=1; fadeCb=cb; }

// ---------- update ----------
function moveToward(dt){ const dx=player.tx-player.x,dy=player.ty-player.y,d=Math.hypot(dx,dy); const cold=player.warmth<25?0.7:1;
  if(d>1.5){ player.moving=true; const sp=54*cold*dt; let nx=player.x+dx/d*Math.min(sp,d),ny=player.y+dy/d*Math.min(sp,d);
    let ok=true; if(scene.mode==="play"){ for(const t of R[ri].trees){ if(Math.hypot(nx-t.x,ny-(t.y+4))<7){ok=false;break;} } }
    if(ok){player.x=nx;player.y=ny;} else {player.tx=player.x;player.ty=player.y;}
    player.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?"left":"right"):(dy<0?"up":"down");
    player.stepT+=dt; if(player.stepT>0.28){player.stepT=0;player.phase^=1;sfxStep();}
  } else { player.moving=false; if(player.arriveCb){const cb=player.arriveCb;player.arriveCb=null;cb();} } }

function update(dt){
  T+=dt; dayClock+=dt; flick=0.86+Math.sin(T*11)*0.06+Math.random()*0.04; if(flashT>0)flashT-=dt;
  updateCap(dt); player.atkCd=Math.max(0,player.atkCd-dt); player.attackT=Math.max(0,player.attackT-dt); player.inv=Math.max(0,player.inv-dt);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)parts.splice(i,1);}
  if(fadeDir!==0){ fade+=fadeDir*dt*1.7; if(fade>=1){fade=1;if(fadeCb){const c=fadeCb;fadeCb=null;c();}fadeDir=-1;} else if(fade<=0){fade=0;fadeDir=0;} }

  if(scene.mode==="san"){ if(!inv.candleLit){ heartbeat._t=(heartbeat._t||0)+dt; if(heartbeat._t>1.1){heartbeat._t=0;heartbeat();} } if(scene.step===3)moveToward(dt); if(inv.candleLit)candleR=Math.min(70,candleR+90*dt); return; }
  if(scene.mode==="end"){ candleR=Math.min(60,candleR+40*dt); return; }
  if(scene.mode!=="play") return;

  const rm=R[ri], B=BIOME[rm.b];
  moveToward(dt); candleR=Math.min(58,candleR+120*dt);
  // walk to any edge that has a way, and be carried through
  if(player.entryGrace>0) player.entryGrace-=dt;
  else if(capDone()){ const ex=rm.exits;   // only the marked opening (mid-edge) is a way through
    if(ex.w!=null && player.x<=8 && Math.abs(player.y-H/2)<24){ travel("w"); return; }
    if(ex.e!=null && player.x>=W-8 && Math.abs(player.y-H/2)<24){ travel("e"); return; }
    if(ex.n!=null && player.y<=48 && Math.abs(player.x-W/2)<28){ travel("n"); return; }
    if(ex.s!=null && player.y>=H-9 && Math.abs(player.x-W/2)<28){ travel("s"); return; } }
  // survival
  let nearFire=false; if(rm.fires) for(const f of rm.fires){ if(f.lit && Math.hypot(player.x-f.x,player.y-f.y)<44) nearFire=true; }
  const sun=sunNow(); const gear=(inv.coat?0.42:1)*(inv.shoes?0.8:1);   // coat+boots ≈ a third of the cold
  if(B.cold<0){ player.warmth=Math.min(100,player.warmth+ -B.cold*dt); }               // cave warms you
  else if(nearFire){ player.warmth=Math.min(100,player.warmth+16*dt); }                 // fire warms
  else if(sun>0.6 && rm.b!=="cave"){ player.warmth=Math.min(100,player.warmth+(sun-0.55)*7*dt); } // midday sun warms
  else { player.warmth-=B.cold*gear*(1-sun*0.5)*dt; }                                    // cold, softened by gear + daylight
  player.hunger-=0.55*dt;
  if(player.hunger<=0){ player.hunger=0; player.hp-=dt*0.4; }
  if(player.warmth<=0){ player.warmth=0; die("The cold has you. You stop shivering — that is the dangerous part."); }

  // gate nudge: after gate, if you wander a non-northern room, the terminal gets impatient
  if(gateOpen && ri!==9 && ri!==10){ gateHint+=dt; if(gateHint>14){ gateHint=0; if(capDone()) nudgeNorth(); } } else gateHint=0;

  // enemies
  for(const en of enemies){ if(en.dead)continue; en.phase+=dt*4; en.hurt=Math.max(0,en.hurt-dt); en.cd=Math.max(0,en.cd-dt);
    const dx=player.x-en.x,dy=player.y-en.y,d=Math.hypot(dx,dy)||0.01; en.dir=dx<0?"left":"right";
    const see=d<en.aggro; if(see&&!en.aggroOn)sfxAlert(en.t); en.aggroOn=see;
    if(see){ const sp=en.spd*dt; en.x+=dx/d*sp; en.y+=dy/d*sp;
      if(d<en.atk && en.cd<=0 && player.inv<=0){ en.cd=1.0; player.hp--; player.inv=1.1; sfxHurt(); if(en.t==="bear")sfxBear(); else if(en.t==="wolf")sfxWolf(); burst(player.x,player.y,C.blood,6); if(player.hp<=0)die("They were faster. The snow drinks what is left."); } }
    else { en.x+=Math.sin(en.phase*0.5)*6*dt; } }
  // arrows
  for(let i=arrows.length-1;i>=0;i--){ const a=arrows[i]; a.x+=a.vx*dt; a.y+=a.vy*dt; a.life-=dt; let gone=a.life<=0||a.x<0||a.x>W||a.y<40||a.y>H;
    for(const en of enemies){ if(en.dead)continue; if(Math.hypot(a.x-en.x,a.y-en.y)<9){ en.hp-=2; en.hurt=0.2; sfxHitEnemy(); burst(en.x,en.y,C.blood,5); if(en.hp<=0)killEnemy(en); gone=true; break; } }
    if(gone)arrows.splice(i,1); }
  // wildlife (silent; flee; drift north after gate)
  for(const w of wildlife){ w.ph+=dt*3; const d=Math.hypot(player.x-w.x,player.y-w.y);
    if(d<15){ w.flee=0.5; const a=Math.atan2(w.y-player.y,w.x-player.x); w.x+=Math.cos(a)*16*dt; w.y+=Math.sin(a)*16*dt; }
    else if(windNorth){ w.y-=14*dt; w.x+=Math.sin(w.ph)*4*dt; if(w.y<44){w.y=H-20;w.x=20+Math.random()*280;} }
    else { w.x+=Math.sin(w.ph*0.4)*8*dt; w.flee=Math.max(0,w.flee-dt); }
    w.x=Math.max(8,Math.min(W-8,w.x)); w.y=Math.max(44,Math.min(H-10,w.y)); }
  // scent motes toward shrine
  if(rm.shrine){ if(motes.length<20&&Math.random()<dt*8) motes.push({x:player.x+(Math.random()*40-20),y:player.y+(Math.random()*30-15),life:2});
    for(let i=motes.length-1;i>=0;i--){ const m=motes[i]; m.life-=dt; m.x+=(rm.shrine.x-m.x)*dt*0.8; m.y+=(rm.shrine.y-10-m.y)*dt*0.8; if(m.life<=0)motes.splice(i,1); } }
}
function die(msg){ if(player._dead)return; player._dead=true; caption(msg,{cb:()=>{ setTimeout(()=>{ player._dead=false; player.hp=player.maxHp; player.warmth=65; player.hunger=Math.max(player.hunger,40); player.inv=1.5; player.x=W/2;player.y=H/2;player.tx=W/2;player.ty=H/2; enemies=(R[ri].enemies||[]).filter(e=>!(R[ri].guard&&e.t==="ranger"&&gateOpen)).map(mkEnemy); caption("You wake again. The forest does not mourn. It simply waits. Learn faster."); },900); }}); }

// ---------- render ----------
function drawGround(B,rm){ px(0,0,W,H,B.g0);
  let s=ri*131+7; const rn=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  for(let i=0;i<70;i++)px(rn()*W,44+rn()*152,rn()<0.5?1:2,1,rn()<0.5?B.g1:B.g0);
  if(B.snow>0){ g.globalAlpha=B.snow*0.85; for(let i=0;i<55;i++){const x=rn()*W,y=44+rn()*152;px(x,y,2+rn()*3,1+rn()*2,C.snow);} g.globalAlpha=1; if(B.snow>=1){g.globalAlpha=0.5;px(0,44,W,156,C.snow);g.globalAlpha=1;} }
  if(rm.sea){ for(let y=118;y<H;y+=3){ const off=Math.sin(T*2+y*0.3)*2; px(0,y,W,2, y<124?C.seaH:(y%6<3?C.sea:C.seaD)); px(off,y,W,1,C.sea);} }
  if(rm.cave){ px(0,44,W,H,"#0d0a08");
    for(let i=0;i<40;i++)px(rn()*W,48+rn()*146,2+rn()*3,1+rn()*2,"#171310");
    px(0,44,W,16,"#080605"); px(0,H-18,W,18,"#080605"); px(0,44,16,H,"#080605"); px(W-16,44,16,H,"#080605");
    for(let i=0;i<12;i++){ const sx=18+i*25; px(sx,58,3,6+((i*7)%11),"#0a0806"); }        // stalactites
    for(let i=0;i<6;i++){ const sx=30+i*48; px(sx,H-24,3,5+((i*5)%8),"#0a0806"); }         // stalagmites
    const gr=g.createRadialGradient(4,H/2,0,4,H/2,62); gr.addColorStop(0,"rgba(120,150,190,.5)"); gr.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle=gr; g.fillRect(0,H/2-62,62,124); } // cave mouth
  if(rm.river){ for(let y=90;y<140;y+=3)px(0,y,W,2,y%6<3?"#3a4658":"#2e3a48"); for(let i=0;i<8;i++)px(rn()*W,92+rn()*44,4,1,C.ice); }
}
function drawScene(){ const rm=R[ri], B=BIOME[rm.b]; drawGround(B,rm);
  if(!rm.cave){ const p=(dayClock%CYCLE)/CYCLE, day=p<0.5, sx=W*((day?p:(p-0.5))/0.5), sy=52-Math.sin((day?p:(p-0.5))/0.5*Math.PI)*30;
    g.save(); g.globalCompositeOperation="lighter"; const col=day?"rgba(255,200,120,":"rgba(180,200,240,"; const s=sunNow();
    const gg=g.createRadialGradient(sx,sy,0,sx,sy,26); gg.addColorStop(0,col+(0.28+ (day?s:0.2)*0.4)+")"); gg.addColorStop(1,col+"0)"); g.fillStyle=gg; g.fillRect(sx-26,sy-26,52,52);
    g.fillStyle=day?"#ffcf8a":"#cdd8f0"; g.fillRect(sx-4,sy-4,8,8); g.restore(); }
  if(rm.cars) for(const c of rm.cars) sprCar(c.x,c.y);
  if(rm.tower) sprTower(rm.tower.x,rm.tower.y);
  if(rm.slab) sprSlab(rm.slab.x,rm.slab.y);
  if(rm.corpse) sprCorpse(rm.corpse.x,rm.corpse.y);
  if(rm.bush) for(const bs of rm.bush) sprBush(bs.x,bs.y,bs.ber);
  if(rm.coat&&!rm.coat.got) sprCoatItem(rm.coat.x,rm.coat.y);
  if(rm.shoes&&!rm.shoes.got) sprShoesItem(rm.shoes.x,rm.shoes.y);
  if(rm.map&&!rm.map.got) sprMapItem(rm.map.x,rm.map.y);
  if(rm.axe&&!rm.axe.got) sprAxe(rm.axe.x,rm.axe.y);
  if(rm.blade&&!rm.blade.got) sprBladeItem(rm.blade.x,rm.blade.y);
  if(rm.bow&&!rm.bow.got) sprBowPick(rm.bow.x,rm.bow.y);
  if(rm.fires) for(const f of rm.fires) sprFire(f.x,f.y,f.lit,T);
  if(rm.dweller) sprDweller(rm.dweller.x,rm.dweller.y,T);
  if(rm.shrine) sprShrine(rm.shrine.x,rm.shrine.y,T);
  const ents=rm.trees.map(t=>({y:t.y,d:()=>sprTree(t.x,t.y,B)}));
  for(const w of wildlife){ ents.push({y:w.y,d:()=>{ const dir=player.x<w.x?"left":"right"; if(w.t==="deer")sprDeer(w.x,w.y,dir); else if(w.t==="raven")sprRaven(w.x,w.y); else if(w.t==="horse")sprHorse(w.x,w.y,dir); else sprDeer(w.x,w.y,dir); }}); }
  for(const en of enemies){ if(en.dead)continue; ents.push({y:en.y,d:()=>{ if(en.hurt>0)g.globalAlpha=0.6; if(en.t==="wolf")sprWolf(en.x,en.y,en.dir,(en.phase|0)%2); else if(en.t==="human")sprHuman(en.x,en.y,en.dir,(en.phase|0)%2); else if(en.t==="bear")sprBear(en.x,en.y,en.dir,(en.phase|0)%2); else sprRanger(en.x,en.y,en.phase); g.globalAlpha=1; }}); }
  const blink=player.inv>0&&((T*12)|0)%2; if(!blink) ents.push({y:player.y,d:()=>sprPlayer(player.x,player.y,player.dir,player.phase,inv.coat)});
  ents.sort((a,b)=>a.y-b.y); for(const e of ents)e.d();
  for(const a of arrows){ px(a.x-1,a.y-1,3,2,"#d8cdb0"); }
  if(player.attackT>0){ const dx={left:-1,right:1,up:0,down:0}[player.dir]||0,dy={up:-1,down:1,left:0,right:0}[player.dir]||0; g.strokeStyle="#eef2fb"; g.globalAlpha=player.attackT*4; g.beginPath(); g.arc(player.x+dx*10,player.y+dy*10,10,0,6.28); g.stroke(); g.globalAlpha=1; }
  for(const m of motes){ g.globalAlpha=Math.min(0.7,m.life); px(m.x,m.y,1,1,C.spirit); g.globalAlpha=1; }
  for(const p of parts){ g.globalAlpha=Math.max(0,p.life/p.max); px(p.x-1,p.y-1,2,2,p.c); } g.globalAlpha=1;
  drawPrecip(B.precip,T,windNorth);
}
function sprCoatItem(x,y){ px(x-5,y+3,10,3,C.shadow); px(x-4,y-6,8,10,C.coat); px(x-4,y-6,8,3,C.coatH); px(x-1,y-5,2,9,"#3a251a"); }
function sprShoesItem(x,y){ px(x-5,y+2,10,2,C.shadow); px(x-5,y-1,4,4,"#3a2a1c"); px(x+1,y-1,4,4,"#3a2a1c"); px(x-5,y+2,4,1,"#20130b"); px(x+1,y+2,4,1,"#20130b"); }
function sprMapItem(x,y){ px(x-5,y+2,10,2,C.shadow); px(x-5,y-6,10,9,"#c9b78a"); px(x-5,y-6,10,2,"#ddc99a"); px(x-3,y-3,6,1,"#7a6a44"); px(x-1,y-6,1,9,"#7a6a44"); px(x+2,y-2,1,1,C.blood); }
function sprBladeItem(x,y){ px(x-4,y+3,8,2,C.shadow); px(x-1,y-11,2,15,"#cfe0ff"); px(x-1,y-11,1,15,"#eef4ff"); px(x-3,y+2,6,2,C.goldD); px(x-1,y+4,2,3,C.trunk); }
function drawBeacons(){ const rm=R[ri],by=Math.sin(T*4)*2; const spark=(x,y)=>{ g.save(); g.globalCompositeOperation="lighter"; const gr=g.createRadialGradient(x,y-13+by,0,x,y-13+by,10); gr.addColorStop(0,"rgba(255,207,92,.5)"); gr.addColorStop(1,"rgba(255,207,92,0)"); g.fillStyle=gr; g.fillRect(x-10,y-23+by,20,20); g.fillStyle=C.gold; g.fillRect(x-1,y-16+by,2,6); g.fillRect(x-3,y-13+by,6,2); g.restore(); };
  for(const key of ["axe","bow","coat","shoes","map","blade"]){ const it=rm[key]; if(it&&!it.got)spark(it.x,it.y); }
  // exit OPENINGS — only the mid-edge is a way through; glows over the dark
  const ex=rm.exits, pulse=0.35+Math.sin(T*3)*0.22;
  const opening=(mx,my,gold)=>{ g.save(); g.globalCompositeOperation="lighter"; g.globalAlpha=pulse;
    const c=gold?"rgba(255,207,92,":"rgba(127,240,176,"; const gr=g.createRadialGradient(mx,my,0,mx,my,17); gr.addColorStop(0,c+"0.75)"); gr.addColorStop(1,c+"0)"); g.fillStyle=gr; g.fillRect(mx-17,my-17,34,34); g.restore(); };
  if(ex.n!=null)opening(W/2,47,windNorth); if(ex.s!=null)opening(W/2,H-7,false);
  if(ex.w!=null)opening(6,H/2,false); if(ex.e!=null)opening(W-6,H/2, ri===0&&!inv.map); }
function drawMap(){ g.fillStyle="rgba(8,10,20,.93)"; g.fillRect(0,0,W,H);
  g.fillStyle=C.gold; g.font="8px 'Courier New',monospace"; g.textAlign="center"; g.fillText("- THE MAP (what you have seen) -",W/2,12);
  const ox=68,oy=46,cw=46,ch=32;
  g.strokeStyle="#3a4a6a"; g.lineWidth=1;
  for(let i=0;i<R.length;i++){ if(!visited.has(i))continue; const ex=R[i].exits; for(const d in ex){ const j=ex[d]; if(j==null||!visited.has(j))continue; const a=MP[i],b=MP[j]; g.beginPath(); g.moveTo(ox+a[0]*cw,oy+a[1]*ch); g.lineTo(ox+b[0]*cw,oy+b[1]*ch); g.stroke(); } }
  for(let i=0;i<R.length;i++){ const p=MP[i],x=ox+p[0]*cw,y=oy+p[1]*ch;
    if(i===ri){ g.fillStyle=C.gold; g.fillRect(x-4,y-4,8,8); }
    else if(visited.has(i)){ g.fillStyle=C.phos; g.fillRect(x-3,y-3,6,6); } }
  g.fillStyle=C.phos; g.font="7px 'Courier New',monospace"; g.fillText(R[ri].name.replace("ASIA · ",""),W/2,H-20);
  g.fillStyle="#7d8ec9"; g.fillText("tap to close",W/2,H-9); g.textAlign="left"; }
function drawAlerts(){ for(const en of enemies){ if(en.dead||!en.aggroOn)continue; const x=en.x,y=en.y-(en.t==="bear"?22:18),by=Math.sin(T*9)*1.5; g.save(); g.globalCompositeOperation="lighter"; const gr=g.createRadialGradient(x,y+by,0,x,y+by,11); gr.addColorStop(0,"rgba(255,207,92,.85)"); gr.addColorStop(1,"rgba(255,207,92,0)"); g.fillStyle=gr; g.fillRect(x-11,y-11+by,22,22); g.restore(); g.fillStyle=C.gold; g.fillRect(x-1,y-7+by,2,7); g.fillRect(x-1,y+2+by,2,2); } }
function applyDark(a){ dg.clearRect(0,0,W,H); dg.fillStyle="rgba(4,6,14,"+a+")"; dg.fillRect(0,0,W,H); dg.globalCompositeOperation="destination-out";
  const cut=(cx,cy,r)=>{const gr=dg.createRadialGradient(cx,cy,0,cx,cy,r);gr.addColorStop(0,"rgba(0,0,0,1)");gr.addColorStop(.6,"rgba(0,0,0,.85)");gr.addColorStop(1,"rgba(0,0,0,0)");dg.fillStyle=gr;dg.fillRect(cx-r,cy-r,r*2,r*2);};
  if(candleR>1)cut(player.x,player.y,candleR*flick);
  if(scene.mode==="play"&&R[ri].fires) for(const f of R[ri].fires){ if(f.lit)cut(f.x,f.y-4,44*flick); }
  if(scene.mode==="play"&&R[ri].shrine)cut(R[ri].shrine.x,R[ri].shrine.y-12,40);
  if(scene.mode==="san"&&scene.step>=1&&!inv.candleLit)cut(160,64,26);
  dg.globalCompositeOperation="source-over"; g.drawImage(dark,0,0);
  if(candleR>1){ g.save(); g.globalCompositeOperation="lighter"; const r=candleR*flick*0.9; const gr=g.createRadialGradient(player.x,player.y-2,0,player.x,player.y-2,r); gr.addColorStop(0,"rgba(255,180,80,.26)"); gr.addColorStop(.5,"rgba(240,130,40,.1)"); gr.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle=gr; g.fillRect(player.x-r,player.y-2-r,r*2,r*2); g.restore(); } }
function drawFrost(){ if(scene.mode!=="play")return; const c=Math.max(0,(30-player.warmth)/30); if(c<=0)return; g.save(); g.globalAlpha=c*0.7; const gr=g.createRadialGradient(W/2,H/2,40,W/2,H/2,180); gr.addColorStop(0,"rgba(120,180,220,0)"); gr.addColorStop(1,"rgba(150,200,235,0.8)"); g.fillStyle=gr; g.fillRect(0,0,W,H); g.restore(); }
function heart(x,y,on){ g.fillStyle=on?C.blood:"#2a2030"; g.fillRect(x,y+1,3,3); g.fillRect(x+4,y+1,3,3); g.fillRect(x+1,y+3,5,2); g.fillRect(x+2,y+5,3,1); }
function drawHUD(){
  for(let i=0;i<player.maxHp;i++) heart(6+i*10,6,i<player.hp);
  const bar=(x,y,v,cOn)=>{ px(x,y,32,4,"#0a0f1a"); const w=Math.max(0,Math.min(32,v/100*32)); px(x,y,w,4,cOn); };
  // warmth: flame icon + bar (blue when low)
  px(W-46,5,3,2,player.warmth<25?C.ice:C.flame); px(W-47,7,5,3,player.warmth<25?C.ice:C.flame); px(W-46,4,2,2,player.warmth<25?C.ice:C.gold);
  bar(W-40,6,player.warmth, player.warmth<25?C.ice:C.flame);
  // food: meat icon + bar
  px(W-47,13,5,3,"#b07a3a"); px(W-48,14,2,2,"#e8d0a0"); bar(W-40,13,player.hunger,"#b07a3a");
  if(knowledge){ g.fillStyle=C.gold; g.font="7px 'Courier New',monospace"; g.fillText("LVL 1  XP "+xp,6,H-6); }
}
function drawArrow(){ const by=Math.sin(T*4)*4; g.save(); g.globalCompositeOperation="lighter"; const gr=g.createRadialGradient(160,64+by,0,160,64+by,26); gr.addColorStop(0,"rgba(255,207,92,.5)"); gr.addColorStop(1,"rgba(255,207,92,0)"); g.fillStyle=gr; g.fillRect(130,34+by,60,60); g.globalCompositeOperation="source-over"; g.fillStyle=C.gold; g.beginPath(); g.moveTo(160,78+by); g.lineTo(150,64+by); g.lineTo(156,64+by); g.lineTo(156,52+by); g.lineTo(164,52+by); g.lineTo(164,64+by); g.lineTo(170,64+by); g.closePath(); g.fill(); g.restore(); }
function drawItems(){ const items=[{k:"knife",x:130},{k:"candle",x:160},{k:"food",x:190}],by=Math.sin(T*3)*2; for(const it of items){ const iy=64+by,s=1.5; g.save(); g.globalCompositeOperation="lighter"; const base=it.k==="candle"?"rgba(255,200,90,":"rgba(150,170,210,"; const gr=g.createRadialGradient(it.x,iy,0,it.x,iy,17); gr.addColorStop(0,base+(it.k==="candle"?0.55:0.3)+")"); gr.addColorStop(1,base+"0)"); g.fillStyle=gr; g.fillRect(it.x-18,iy-18,36,36); g.restore(); icon(it.k,g,it.x-8*s,iy-8*s,s); if(it.k==="candle"){g.strokeStyle="rgba(255,207,92,"+(0.4+Math.sin(T*5)*0.3)+")";g.lineWidth=1;g.strokeRect(it.x-11,iy-13,22,27);} } }
function drawSan(){ px(0,0,W,H,C.ink); for(let y=64;y<176;y+=16)for(let x=40;x<280;x+=16)px(x,y,15,15,(x/16+y/16)%2?"#171d33":"#12172b");
  px(36,60,248,4,"#141a30"); px(36,172,248,5,"#141a30"); px(36,60,4,118,"#141a30"); px(280,60,4,118,"#141a30");
  px(34,90,12,20,"#20130b"); px(35,91,10,18,C.trunk); px(35,91,10,3,C.trunkD); px(42,100,2,2,C.gold);
  const open=inv.candleLit||scene.step>=2; px(152,126,16,4,C.shadow); px(152,118,16,10,C.trunkD); px(152,118,16,3,C.trunk); px(152,121,16,1,C.gold);
  if(open){px(152,112,16,6,C.trunkD);px(153,119,14,2,"#20130b");} else {px(152,117,16,4,C.trunk);px(159,121,2,3,C.gold);}
  if(inv.candleLit||scene.step===3)sprPlayer(player.x,player.y,player.dir,player.phase,false); }
function render(){
  if(scene.mode==="boot"){ px(0,0,W,H,C.night); g.fillStyle=C.phos; g.font="8px 'Courier New',monospace"; g.textBaseline="top";
    const L=["GARBHA  //  the golden womb","chapter one : asia","","> loading dream.exe .............. ok","> memory ....................... corrupt","> you ......................... unborn"];
    for(let i=0;i<L.length;i++)g.fillText(L[i],14,28+i*12); if(Math.floor(T*2)%2===0){g.fillStyle=C.gold;g.fillText("> CLICK / ANY KEY TO BE BORN",14,28+7*12);}
    g.fillStyle="#3f9a6a"; g.fillText("build "+BUILD+"  (if this isn't the latest, hard-refresh: Cmd+Shift+R)",14,H-16); return; }
  if(scene.mode==="san"){ drawSan(); applyDark(inv.candleLit?0.86:0.985); if(scene.step===1&&!inv.candleLit)drawArrow(); if(scene.step===2&&!inv.candleLit)drawItems();
    if(scene.step===3){ const dx=40,dy=100,by=Math.sin(T*4)*3; g.save(); g.globalCompositeOperation="lighter"; const gr=g.createRadialGradient(dx,dy,0,dx,dy,24); gr.addColorStop(0,"rgba(255,207,92,.6)"); gr.addColorStop(1,"rgba(255,207,92,0)"); g.fillStyle=gr; g.fillRect(dx-24,dy-24,48,48); g.fillStyle=C.gold; px(dx+16+by,dy-1,7,2,C.gold); px(dx+16+by,dy-4,2,3,C.gold); px(dx+16+by,dy+1,2,3,C.gold); px(dx+14+by,dy-2,2,4,C.gold); g.restore(); } }
  else if(scene.mode==="play"){ drawScene(); const B2=BIOME[R[ri].b]; const dk=R[ri].b==="cave"?B2.dark:Math.max(0.32,B2.dark*(1-sunNow()*0.62)); applyDark(dk); drawFrost(); drawBeacons(); drawAlerts(); drawHUD(); }
  else if(scene.mode==="end"){ drawScene(); applyDark(0.5); drawHUD(); g.fillStyle="rgba(5,10,7,.5)"; g.fillRect(0,0,W,H); g.textAlign="center"; g.fillStyle=C.gold; g.font="10px 'Courier New',monospace"; g.fillText("KNOWLEDGE",W/2,84); g.fillStyle=C.spirit; g.font="7px 'Courier New',monospace"; g.fillText("the world boots up",W/2,98); g.textAlign="left"; }
  if(inv.mapOpen && scene.mode==="play") drawMap();
  if(flashT>0){ g.fillStyle="rgba(220,240,255,"+Math.min(1,flashT)+")"; g.fillRect(0,0,W,H); }
  if(fade>0){ g.fillStyle="rgba(3,5,12,"+fade+")"; g.fillRect(0,0,W,H); }
}
function setInv(){ document.querySelectorAll("#inv .slot").forEach(sl=>{ const k=sl.dataset.i;
  const have=k==="knife"?!!weapon:k==="bow"?inv.bow:k==="candle"?inv.candle:k==="coat"?(inv.coat||inv.shoes):k==="food"?inv.food>0:k==="map"?inv.map:false;
  sl.classList.toggle("have",!!have); if(k==="candle")sl.classList.toggle("lit",inv.candleLit); });
  durEl.textContent=weapon?weapon.dur:""; breadnEl.textContent=inv.food>0?inv.food:""; arrnEl.textContent=inv.bow?inv.arrows:""; }

let last=0; function frame(ts){ const dt=Math.min(0.05,(ts-last)/1000)||0; last=ts; update(dt); render(); requestAnimationFrame(frame); }
setInv(); requestAnimationFrame(frame);
})();
</script>
